name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          VITEST_MAX_WORKERS: 4

  effect-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        effect: ["4.0.0", "4.0.1", "4.0.2", "4.0.3", "4.0.4", "4.0.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:effect ${{ matrix.effect }}
        env:
          VITEST_MAX_WORKERS: 4
